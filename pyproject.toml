[project]
name = "multi_agent_ai_system"
version = "0.1.0"
description = "multi_agent_ai_system using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,spreadsheets,tools]>=1.15.44,<2.0.0",
    "exa-py",
    "fastapi>=0.115,<1",
    "httpx[socks]>=0.28,<1",
    "pydantic",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agent_ai_system"]

[tool.crewai]
type = "flow"
definition = "src/multi_agent_ai_system/flow.json"
project_id = "8c89a936-ca0e-4046-917c-9ef7f04a743c"

[tool.uv]
constraint-dependencies = ["crewai==1.15.44"]
override-dependencies = ["filelock>=4.2.1,<5; python_version >= '3.11'", "filelock<4; python_version < '3.11'"]
