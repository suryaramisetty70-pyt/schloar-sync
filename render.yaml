services:
  - type: web
    name: scholarsync-ai
    runtime: python
    plan: free
    buildCommand: pip install -r scholarsync/requirements.txt
    startCommand: python -m uvicorn scholarsync.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: SCHOLARSYNC_USERNAME
        sync: false
      - key: SCHOLARSYNC_PASSWORD
        sync: false
