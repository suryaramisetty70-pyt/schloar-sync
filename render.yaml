services:
  - type: web
    name: scholarsync-ai
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --locked
    startCommand: uv run --no-sync python -m uvicorn scholarsync.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4.1-mini
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: SCHOLARSYNC_USERNAME
        sync: false
      - key: SCHOLARSYNC_PASSWORD
        sync: false
